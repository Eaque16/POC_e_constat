[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "e-constat-ia"
version = "0.1.0"
description = "POC d'assistance IA à la déclaration automobile, avec validation humaine obligatoire"
requires-python = "==3.11.*"
dependencies = [
  "alembic==1.13.2",
  "bcrypt==4.0.1",
  "fastapi==0.112.2",
  "gradio==4.44.0",
  "httpx==0.27.2",
  "jinja2==3.1.4",
  "numpy==1.26.4",
  "passlib==1.7.4",
  "psycopg[binary]==3.2.1",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "pyjwt==2.9.0",
  "python-multipart==0.0.9",
  "rapidfuzz==3.9.6",
  "sqlalchemy==2.0.32",
  "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
ai = [
  "ctranslate2==4.4.0",
  "faster-whisper==1.0.3",
  "huggingface-hub==0.24.6",
  "pyannote.audio==3.3.2",
  "torch==2.4.1",
  "torchaudio==2.4.1",
]
dev = [
  "coverage==7.6.1",
  "pytest==8.3.2",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["econstat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI utilise Depends/File dans les valeurs par défaut par conception.
